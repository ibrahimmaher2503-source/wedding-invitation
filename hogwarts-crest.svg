<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldCrest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eccb78"/>
      <stop offset="0.5" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#8b6914"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#goldCrest)" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldCrest)" stroke-width="0.8" opacity="0.7"/>
  <!-- Deathly Hallows: triangle (cloak), circle (stone), line (wand) -->
  <path d="M50 24 L74 66 L26 66 Z" fill="none" stroke="url(#goldCrest)" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="50" y1="24" x2="50" y2="66" stroke="url(#goldCrest)" stroke-width="2.2"/>
  <circle cx="50" cy="51" r="13" fill="none" stroke="url(#goldCrest)" stroke-width="2.2"/>
  <!-- initials -->
  <text x="35" y="84" font-family="Cinzel, serif" font-size="13" font-weight="700" fill="url(#goldCrest)" text-anchor="middle">K</text>
  <text x="50" y="84" font-family="Cinzel, serif" font-size="11" fill="url(#goldCrest)" text-anchor="middle">&amp;</text>
  <text x="65" y="84" font-family="Cinzel, serif" font-size="13" font-weight="700" fill="url(#goldCrest)" text-anchor="middle">R</text>
</svg>
